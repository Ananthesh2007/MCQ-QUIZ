<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Quiz Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #e8ecf4;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Page Management */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Landing Page Styles */
        .landing-card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 600px;
            margin: 40px auto;
        }

        .logo-circle {
            width: 64px;
            height: 64px;
            background: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .logo-circle svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .landing-card h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .subjects-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .subject-btn {
            width: 100%;
            padding: 20px 24px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
            background: white;
            color: #374151;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-btn:hover {
            border-color: #4f46e5;
            background: #f5f3ff;
            transform: translateX(4px);
        }

        .units-badge {
            background: #e0e7ff;
            color: #4f46e5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Units Dashboard */
        .units-container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #4f46e5;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            padding: 8px 0;
            border: none;
            background: none;
            font-size: 15px;
        }

        .back-btn:hover {
            color: #4338ca;
        }

        .subject-title {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .units-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .unit-btn {
            width: 100%;
            padding: 24px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-btn:hover {
            border-color: #4f46e5;
            background: #f5f3ff;
            transform: translateX(4px);
        }

        .unit-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .unit-number {
            width: 48px;
            height: 48px;
            background: #4f46e5;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .unit-name {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
        }

        .questions-badge {
            background: #f3f4f6;
            color: #6b7280;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Mode Selection Page */
        .mode-container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .mode-title {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .mode-subtitle {
            color: #6b7280;
            margin-bottom: 32px;
        }

        .mode-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #6b7280;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 24px;
            padding: 8px 0;
            border: none;
            background: none;
            font-size: 14px;
        }

        .mode-back-btn:hover {
            color: #4f46e5;
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mode-btn {
            width: 100%;
            padding: 24px;
            font-size: 18px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-align: center;
            background: white;
        }

        .mode-btn.pdf-order {
            border-color: #4f46e5;
            color: #4f46e5;
        }

        .mode-btn.pdf-order:hover {
            background: #4f46e5;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .mode-btn.random {
            border-color: #db2777;
            color: #db2777;
        }

        .mode-btn.random:hover {
            background: #db2777;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(219, 39, 119, 0.3);
        }

        .mode-btn small {
            display: block;
            font-size: 14px;
            font-weight: 400;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* Quiz Container Styles */
        .quiz-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #6b7280;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 16px;
            padding: 8px 0;
            border: none;
            background: none;
            font-size: 14px;
        }

        .quiz-back-btn:hover {
            color: #4f46e5;
        }

        .quiz-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 8px;
        }

        .quiz-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .question-badge {
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            color: #1f2937;
            font-size: 14px;
        }

        .timer {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .score-display {
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
        }

        .progress-line {
            height: 4px;
            background: #d1d5db;
            border-radius: 2px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4f46e5;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .question-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .question-text {
            font-size: 20px;
            color: #1f2937;
            margin-bottom: 24px;
            font-weight: 500;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            text-align: left;
            width: 100%;
        }

        .option:hover:not(.disabled) {
            border-color: #4f46e5;
            background: #f5f3ff;
        }

        .option-letter {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #6b7280;
            flex-shrink: 0;
            font-size: 14px;
        }

        .option-text {
            color: #374151;
            font-size: 15px;
            line-height: 1.4;
        }

        .option.correct {
            border-color: #22c55e;
            background: #f0fdf4;
        }

        .option.correct .option-letter {
            background: #22c55e;
            color: white;
        }

        .option.wrong {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .option.wrong .option-letter {
            background: #ef4444;
            color: white;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .quiz-controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-prev {
            background: white;
            color: #374151;
            border: 1px solid #e5e7eb;
        }

        .btn-prev:hover:not(:disabled) {
            background: #f9fafb;
        }

        .btn-prev:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-submit {
            background: #4f46e5;
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            background: #4338ca;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback {
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .feedback.correct {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #86efac;
        }

        .feedback.wrong {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* Results Styles */
        .results-card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: white;
            font-size: 32px;
            font-weight: 700;
        }

        .results-message {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .btn-restart {
            background: #4f46e5;
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .landing-card {
                padding: 32px 24px;
                margin: 20px auto;
            }
            
            .question-card {
                padding: 24px;
            }
            
            .question-text {
                font-size: 18px;
            }
        }
    </style>
    
</head>
<body>
    <div class="container">
        <!-- PAGE 1: SUBJECTS DASHBOARD -->
        <div class="page active" id="subjectsPage">
            <div class="landing-card">
                <div class="logo-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </div>
                
                <h1>Engineering Quiz Portal</h1>
                <p class="subtitle">Select a subject to start practicing</p>
                
                <div class="subjects-grid">
                    <button class="subject-btn" onclick="showUnits(1)">
                        <span>Discrete Mathematical Structures and Probability Theory</span>
                        <span class="units-badge">5 Units</span>
                    </button>
                    
                    <button class="subject-btn" onclick="showUnits(2)">
                        <span>Data Structures</span>
                        <span class="units-badge">5 Units</span>
                    </button>
                    
                    <button class="subject-btn" onclick="showUnits(3)">
                        <span>Object Oriented Programming</span>
                        <span class="units-badge">5 Units</span>
                    </button>
                    
                    <button class="subject-btn" onclick="showUnits(4)">
                        <span>Computer Organization and Architecture</span>
                        <span class="units-badge">5 Units</span>
                    </button>
                    
                    <button class="subject-btn" onclick="showUnits(5)">
                        <span>Software Engineering and Applications</span>
                        <span class="units-badge">5 Units</span>
                    </button>
                    
                    <button class="subject-btn" onclick="showUnits(6)">
                        <span>Indian Knowledge Systems and Indian Culture</span>
                        <span class="units-badge">3 Units</span>
                    </button>
                    
                    <button class="subject-btn" onclick="showUnits(7)">
                        <span>Developing Professional Skills</span>
                        <span class="units-badge">3 Units</span>
                    </button>
                    
                    <button class="subject-btn" onclick="showUnits(8)">
                        <span>Kannada</span>
                        <span class="units-badge">3 Units</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- PAGE 2: UNITS DASHBOARD -->
        <div class="page" id="unitsPage">
            <div class="units-container">
                <button class="back-btn" onclick="backToSubjects()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back to Subjects
                </button>
                
                <h2 class="subject-title" id="unitsSubjectTitle">Subject Name</h2>
                
                <div class="units-grid" id="unitsGrid">
                    <!-- Units will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- PAGE 3: QUIZ MODE SELECTION -->
        <div class="page" id="modePage">
            <div class="mode-container">
                <button class="mode-back-btn" onclick="backToUnits()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back to Units
                </button>
                
                <h2 class="mode-title">Select Quiz Mode</h2>
                <p class="mode-subtitle">Choose how you want to take the quiz</p>
                
                <div class="mode-buttons">
                    <button class="mode-btn pdf-order" onclick="startQuiz('pdf')">
                        📄 PDF Order
                        <small>Questions in original order, options shuffled</small>
                    </button>
                    <button class="mode-btn random" onclick="startQuiz('random')">
                        🎲 Random Mode
                        <small>Questions and options both shuffled</small>
                    </button>
                </div>
            </div>
        </div>

        <!-- PAGE 4: QUIZ -->
        <div class="page" id="quizPage">
            <button class="quiz-back-btn" onclick="backToModeSelection()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Mode Selection
            </button>
            
            <div class="quiz-header-bar">
                <div class="quiz-header-left">
                    <span class="question-badge" id="questionCounter">Q1/20</span>
                    <span class="timer">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span id="timer">00:00</span>
                    </span>
                </div>
                <span class="score-display" id="scoreDisplay">Score: 0/0</span>
            </div>
            
            <div class="progress-line">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="question-card">
               <div class="question-text" id="questionText"></div>
                
                <div class="feedback" id="feedback"></div>
                
                <div class="options-container" id="optionsContainer"></div>
                
                <div class="quiz-controls">
                    <button class="btn btn-prev" id="prevBtn" onclick="previousQuestion()" disabled>← Previous</button>
                    <button class="btn btn-submit" id="submitBtn" onclick="submitAnswer()" disabled>Submit Answer</button>
                </div>
            </div>
        </div>

        <!-- PAGE 5: RESULTS -->
        <div class="page" id="resultsPage">
            <div class="results-card">
                <div class="score-circle" id="finalScore">0%</div>
                <h2 style="color: #1f2937; margin-bottom: 12px;">Quiz Completed!</h2>
                <p class="results-message" id="resultsMessage"></p>
                <button class="btn-restart" onclick="backToSubjects()">← Back to Subjects</button>
            </div>
        </div>
    </div>

    <script>
        // Subject and Unit Data
const subjects = {
    1: { name: "Discrete Mathematical Structures and Probability Theory", units: ["Unit 1", "Unit 2", "Unit 3", "Unit 4", "Unit 5"] },
    2: { name: "Data Structures", units: ["Unit 1", "Unit 2", "Unit 3", "Unit 4", "Unit 5"] },
    3: { name: "Object Oriented Programming", units: ["Unit 1", "Unit 2", "Unit 3", "Unit 4", "Unit 5"] },
    4: { name: "Computer Organization and Architecture", units: ["Unit 1", "Unit 2", "Unit 3", "Unit 4", "Unit 5"] },
    5: { name: "Software Engineering and Applications", units: ["Unit 1", "Unit 2", "Unit 3", "Unit 4", "Unit 5"] },
    6: { name: "Indian Knowledge Systems and Indian Culture", units: ["Unit 1", "Unit 2", "Unit 3"] },
    7: { name: "Developing Professional Skills", units: ["Unit 1", "Unit 2", "Unit 3"] },
    8: { name: "Kannada", units: ["Unit 1", "Unit 2", "Unit 3"] }
};

// ============================================
// QUESTION DATABASE
// ============================================
const questionDatabase = {
    // SUBJECT 1: Discrete Mathematical Structures and Probability Theory
    1: {
        // UNIT 1
        1: [
        { q: "The compound proposition p ∧ q is true when", options: ["Both p and q are true", "Exactly one is true", "Both p and q are false", "None of these"], correct: 0 },
        { q: "The compound proposition p ∨ q is false when", options: ["Both p and q are true", "Exactly one is false", "Both p and q are false", "None of these"], correct: 2 },
        { q: "The implication p → q is false when", options: ["p is true and q is true", "p is true and q is false", "p is false and q is true", "None of these"], correct: 1 },
        { q: "The truth value of a tautological proposition is", options: ["Always false", "Always true", "Sometimes true", "Sometimes false"], correct: 1 },
        { q: "The truth value of a contradiction proposition is", options: ["Always False", "Always True", "Sometimes True", "Sometimes False"], correct: 0 },
        { q: "Which of the following propositions is a contingency?", options: ["p → q", "p ∨ ¬p", "p ∧ ¬p", "None of these"], correct: 0 },
        { q: "The logical equivalent of p → q is", options: ["q → p", "p ∨ ¬q", "p ∧ ¬q", "¬p ∨ q"], correct: 3 },
        { q: "Which of the following is true", options: ["¬(p ∧ q) ≡ ¬p ∨ ¬q", "¬(p ∧ q) ≡ ¬p ∧ ¬q", "¬(p ∨ q) ≡ ¬p ∨ ¬q", "¬(p → q) ≡ ¬p ∨ ¬q"], correct: 0 },
        { q: "The contrapositive of p → q is", options: ["¬p → ¬q", "¬q → ¬p", "q → p", "None of these"], correct: 1 },
        { q: "The converse of p → q is", options: ["¬p → ¬q", "¬q → ¬p", "q → p", "None of these"], correct: 2 },
        { q: "The inverse of 'If today is Sunday then the library is closed.' is:", options: ["If today is not Sunday, then the library is open.", "If library is closed then its Sunday", "If library is open then its not Sunday", "None of these"], correct: 0 },
        { q: "The converse of 'If a number is divisible by 6, then it is divisible by 3.' is:", options: ["If divisible by 3, then divisible by 6.", "If not divisible by 3, then divisible by 6.", "If divisible by 3, then not divisible by 6.", "None of these"], correct: 0 },
        { q: "The contrapositive of \"If the score is greater than 70, then distinction is awarded.\" is:", options: ["If distinction is not awarded, then the score is less than or equal to 70.", "If distinction is awarded, then the score is greater than 70.", "If the score is less than 70, then distinction is not awarded.", "None of these"], correct: 0 },
        { q: "Let the domain be students in the class and let C(x) denote \"x has studied calculus\", then the logical expression of \"Every student in this class has studied calculus\", is", options: ["∃x C(x)", "∀x C(x)", "∀x ¬C(x)", "None of these"], correct: 1 },
        { q: "Let the domain be creatures. Let L(x) denote \"x is a lion\" and F(x) denote \"x is fierce.\" then the logical expression of \"All lions are fierce\" is", options: ["∀x L(x) → F(x)", "∀x L(x) ∧ F(x)", "∃x L(x) → F(x)", "∀x F(x) → L(x)"], correct: 0 },
        { q: "Let the domain be people and let P(x) denote \"x is perfect.\" then the logical expression of \"No one is perfect\" is", options: ["∃x P(x)", "∀x P(x)", "∀x ¬P(x)", "∃x ¬P(x)"], correct: 2 },
        { q: "Let the domain be students at your school. Let P(x) denote \"x can speak Russian\" and Q(x) denote \"x knows C ++.\" then the logical expression of \"Every student can speak Russian or knows C ++\" is", options: ["∃x (P(x) ∨ Q(x))", "∀x (P(x) ∨ Q(x))", "∀x (P(x) ∧ Q(x))", "∀x (P(x) → Q(x))"], correct: 1 },
        { q: "\"Kangaroos live in Australia and are marsupials. Therefore, kangaroos are marsupials.\"", options: ["Modus Ponens", "Simplification", "Addition", "Modus Tollens"], correct: 1 },
        { q: "\"Seetha is an excellent swimmer. If Seetha is an excellent swimmer, then she can work as a lifeguard. Therefore, Seetha can work as a lifeguard.\"", options: ["Modus Ponens", "Disjunctive Syllogism", "Simplification", "Modus Tollens"], correct: 0 },
        { q: "\"Krishna will not travel abroad. Krishna will work at a computer company or he will travel abroad. Therefore, Krishna will work at a computer company.\"", options: ["Disjunctive Syllogism", "Modus Ponens", "Addition", "Simplification"], correct: 0 }
        ],
        // UNIT 2: 
        2:[],

// Navigation Functions

    document.getElementById('unitsSubjectTitle').textContent = subject.name;
    
    const unitsGrid = document.getElementById('unitsGrid');
    unitsGrid.innerHTML = '';
    
    subject.units.forEach((unitName, index) => {
        const btn = document.createElement('button');
        btn.className = 'unit-btn';
        btn.onclick = () => selectUnit(index + 1);
        btn.innerHTML = `

            <span class="questions-badge">Questions</span>

// Quiz Functions
function shuffleArray(array) {
    const newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
}

function prepareQuestions(modeType) {
    let questions = [...currentQuestions];
    
    // Always shuffle options within each question
    questions = questions.map(q => {
        const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
        const shuffledOptions = shuffleArray(optionsWithIndex);
        const newCorrectIndex = shuffledOptions.findIndex(opt => opt.originalIndex === q.correct);
        
        return {
            q: q.q,
            options: shuffledOptions.map(opt => opt.text),
            correct: newCorrectIndex
        };
    });
    
    // Only shuffle questions if random mode
    if (modeType === 'random') {
        questions = shuffleArray(questions);
    }
    
    return questions;
}

function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const seconds = (elapsed % 60).toString().padStart(2, '0');
    const timerEl = document.getElementById('timer');
    if (timerEl) timerEl.textContent = `${minutes}:${seconds}`;
}

function startQuiz(selectedMode) {
    mode = selectedMode;
    // Load questions from database
    currentQuestions = loadQuestionsForUnit(currentSubject, currentUnit);
    
    if (currentQuestions.length === 0) {
        alert('No questions available for this unit yet!');
        return;
    }
    
    currentQuestions = prepareQuestions(mode);
    
    currentQuestionIndex = 0;
    score = 0;
    selectedAnswer = null;
    userAnswers = [];
    startTime = Date.now();
    
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
    
    showPage('quizPage');
    displayQuestion();
}

function loadQuestionsForUnit(subjectId, unitId) {
    // Check if we have questions for this subject and unit
    if (questionDatabase[subjectId] && questionDatabase[subjectId][unitId]) {
        return questionDatabase[subjectId][unitId];
    }
    return [];
}

function displayQuestion() {
    answered = false;
    const question = currentQuestions[currentQuestionIndex];
    const previousAnswer = userAnswers[currentQuestionIndex];
    
    document.getElementById('questionCounter').textContent = 
        `Q${currentQuestionIndex + 1}/${currentQuestions.length}`;
    document.getElementById('scoreDisplay').textContent = 
        `Score: ${score}/${currentQuestionIndex}`;
    document.getElementById('progressFill').style.width = 
        `${((currentQuestionIndex) / currentQuestions.length) * 100}%`;
    
    document.getElementById('questionText').textContent = question.q;
    
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    
    const letters = ['A', 'B', 'C', 'D'];
    question.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerHTML = `
            <span class="option-letter">${letters[index]}</span>
            <span class="option-text">${option}</span>
        `;
        btn.onclick = () => selectOption(index, btn);
        optionsContainer.appendChild(btn);
    });
    
    const feedback = document.getElementById('feedback');
    feedback.style.display = 'none';
    
    const submitBtn = document.getElementById('submitBtn');
    const prevBtn = document.getElementById('prevBtn');
    
    if (prevBtn) prevBtn.disabled = currentQuestionIndex === 0;
    
    if (previousAnswer !== undefined && previousAnswer !== null) {
        answered = true;
        selectedAnswer = previousAnswer.selected;
        const isCorrect = previousAnswer.correct;
        
        const options = optionsContainer.querySelectorAll('.option');
        
        options.forEach((opt, idx) => {
            opt.classList.add('disabled');
            if (idx === question.correct) opt.classList.add('correct');
            if (idx === selectedAnswer) {
                if (idx === question.correct) opt.classList.add('correct');
                else opt.classList.add('wrong');
            }
        });
        
        if (isCorrect) {
            feedback.textContent = '✅ Correct! Well done!';
            feedback.className = 'feedback correct';
        } else {
            feedback.textContent = `❌ Incorrect. You chose: ${question.options[selectedAnswer]}. The correct answer is: ${question.options[question.correct]}`;
            feedback.className = 'feedback wrong';
        }
        feedback.style.display = 'block';
        
        submitBtn.textContent = 'Next →';
        submitBtn.onclick = nextQuestion;
        submitBtn.disabled = false;
    } else {
        selectedAnswer = null;
        submitBtn.textContent = 'Submit Answer';
        submitBtn.disabled = true;
        submitBtn.onclick = submitAnswer;
    }
}

function selectOption(index, btnElement) {
    if (answered) return;
    selectedAnswer = index;
    
    document.querySelectorAll('.option').forEach(opt => {
        opt.style.borderColor = '#e5e7eb';
        opt.style.background = 'white';
    });
    
    btnElement.style.borderColor = '#4f46e5';
    btnElement.style.background = '#f5f3ff';
    
    document.getElementById('submitBtn').disabled = false;
}

function submitAnswer() {
    if (selectedAnswer === null || answered) return;
    answered = true;
    
    const question = currentQuestions[currentQuestionIndex];
    const options = document.querySelectorAll('.option');
    const feedback = document.getElementById('feedback');
    const submitBtn = document.getElementById('submitBtn');
    
    const isCorrect = selectedAnswer === question.correct;
    
    userAnswers[currentQuestionIndex] = {
        selected: selectedAnswer,
        correct: isCorrect
    };
    
    if (isCorrect) score++;
    
    options.forEach((opt, idx) => {
        opt.classList.add('disabled');
        if (idx === question.correct) opt.classList.add('correct');
        if (idx === selectedAnswer) {
            if (idx === question.correct) opt.classList.add('correct');
            else opt.classList.add('wrong');
        }
    });
    
    if (isCorrect) {
        feedback.textContent = '✅ Correct! Well done!';
        feedback.className = 'feedback correct';
    } else {
        feedback.textContent = `❌ Incorrect. You chose: ${question.options[selectedAnswer]}. The correct answer is: ${question.options[question.correct]}`;
        feedback.className = 'feedback wrong';
    }
    
    feedback.style.display = 'block';
    document.getElementById('scoreDisplay').textContent = 
        `Score: ${score}/${currentQuestionIndex + 1}`;
    
    submitBtn.textContent = 'Next →';
    submitBtn.onclick = nextQuestion;
    submitBtn.disabled = false;
}

function previousQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        displayQuestion();
    }
}

function nextQuestion() {
    currentQuestionIndex++;
    
    if (currentQuestionIndex < currentQuestions.length) {
        displayQuestion();
    } else {
        if (timerInterval) clearInterval(timerInterval);
        showResults();
    }
}

function showResults() {
    showPage('resultsPage');
    
    const percentage = Math.round((score / currentQuestions.length) * 100);
    document.getElementById('finalScore').textContent = `${percentage}%`;
    
    let message = '';
    if (percentage >= 90) message = '🌟 Outstanding! You mastered this unit!';
    else if (percentage >= 70) message = '👏 Great job! You have a solid understanding.';
    else if (percentage >= 50) message = '👍 Good effort! Keep learning.';
    else message = '📚 Review the material and try again.';
    
    document.getElementById('resultsMessage').textContent = 
        `${message} You answered ${score} out of ${currentQuestions.length} correctly.`;
}

// Math Equation Editor Functions
function openEquationEditor() {
    document.getElementById('equationModal').style.display = 'flex';
    const input = document.getElementById('latexInput');
    input.value = '';
    input.focus();

    // Live preview
    input.oninput = function() {
        const preview = document.getElementById('equationPreview');
        preview.innerHTML = `\\(${this.value}\\)`;
        if (window.MathJax) {
            MathJax.typesetClear([preview]);
            MathJax.typesetPromise([preview]).catch(() => {});
        }
    };
}

function closeEquationEditor() {
    document.getElementById('equationModal').style.display = 'none';
}

function insertEquation() {
    const latex = document.getElementById('latexInput').value.trim();
    if (!latex) {
        alert("Please type a math equation!");
        return;
    }

    const questionText = document.getElementById('questionText');
    questionText.innerHTML += `<br><br>\\(${latex}\\)`;

    // Render the equation
    if (window.MathJax) {
        MathJax.typesetPromise().catch(() => {});
    }

    closeEquationEditor();
}
